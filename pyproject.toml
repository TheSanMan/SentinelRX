[project]
name = "sentinelrx"
version = "0.1.0"
description = "Medication reference workspace backed by DrugBank data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "hishel>=0.0.33",
    "structlog>=24.1.0",
    "pydantic>=2.7.0",
    "rapidfuzz>=3.9.0",
    "python-dotenv>=1.0.0",
    "lxml>=5.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
strict = true
